substitutions:
  _REGION: us-central1
  _REPOSITORY: rag-services
  _API_SERVICE: filing-rag-api
  _WORKER_SERVICE: filing-rag-worker

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.api", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.worker", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      ["run", "deploy", "${_API_SERVICE}", "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA", "--region", "${_REGION}", "--no-allow-unauthenticated"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      ["run", "deploy", "${_WORKER_SERVICE}", "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$SHORT_SHA", "--region", "${_REGION}", "--no-allow-unauthenticated"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$SHORT_SHA"
