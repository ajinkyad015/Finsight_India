services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag
      APP_ENV: local
      LOCAL_AUTH_ENABLED: "true"
      LOCAL_STORAGE_DIR: /app/.local/gcs
      WORKER_URL: http://worker:8080/api/v1/worker/process
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - local-gcs:/app/.local/gcs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag
      APP_ENV: local
      LOCAL_STORAGE_DIR: /app/.local/gcs
    depends_on:
      - postgres
    volumes:
      - local-gcs:/app/.local/gcs

volumes:
  postgres-data:
  local-gcs:
